# CI: runs `uv run pytest` on every push and every pull request into main.
# Only runs tests — never merges, pushes or changes anything.
# GUI tests (-m gui) and real-desktop tests are NOT run here (no screen, no GTK 4.22, no Hyprland);
# those run locally / in the Hyprland VM.

name: tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]   # declared minimum (A20) + the dev machine's version

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked --python "$(which python)"

      - name: Run tests
        run: uv run --python "$(which python)" pytest -ra

  # M3.3: integration tests run ONLY inside bubblewrap. If the sandbox cannot start, this job FAILS
  # (harness exits 3) — it never falls back to running unsandboxed and never passes by skipping.
  integration:
    name: integration (bubblewrap sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: System packages (bubblewrap + the tools the integration tests drive)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap fontconfig pango1.0-tools gsettings-desktop-schemas \
            libglib2.0-bin python3-gi python3-gi-cairo gir1.2-pango-1.0 gir1.2-freedesktop python3-pytest lua5.4

      - name: Allow unprivileged user namespaces (Ubuntu 24.04 restricts them via AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked --python /usr/bin/python3

      - name: Diagnose the Pango probe (a crash, exit 139, prints no error by itself)
        continue-on-error: true
        run: |
          uv run --python /usr/bin/python3 python - <<'PY'
          import subprocess
          from pathlib import Path
          from harness import run_integration as ri, sandbox
          inner = r"""
          import faulthandler, os, sys
          faulthandler.enable()
          from pathlib import Path
          def say(*a): print(*a, flush=True)
          Path(os.environ["FONTCONFIG_FILE"]).write_text('<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd"><fontconfig><include>/etc/fonts/fonts.conf</include></fontconfig>')
          say("1 python", sys.version.split()[0])
          import gi
          gi.require_version("Pango", "1.0"); gi.require_version("PangoCairo", "1.0")
          from gi.repository import Pango, PangoCairo
          say("2 imported; Pango", Pango.version_string())
          fm = PangoCairo.FontMap.get_default()
          say("3 font map", type(fm).__name__)
          ctx = fm.create_context()
          say("4 context")
          layout = Pango.Layout.new(ctx)
          desc = Pango.FontDescription(); desc.set_family("sans-serif"); desc.set_size(12 * Pango.SCALE)
          layout.set_font_description(desc)
          say("5 description set")
          layout.set_text("The quick brown fox 0123456789", -1)
          say("6 text set")
          it = layout.get_iter()
          say("7 iter")
          run = it.get_run()
          say("8 run", run is not None)
          say("9 family", run.item.analysis.font.describe().get_family())
          """
          cmd = ["/usr/bin/python3", "-u", "-X", "faulthandler", "-c", inner]
          r = subprocess.run(sandbox.build_argv(cmd, repo=Path('.').resolve(), site_packages=ri.site_packages()), capture_output=True, text=True)
          print("exit code", r.returncode, "(139 = segfault)")
          print(r.stdout)
          print(r.stderr[-3000:])
          PY
          echo "--- fonts the runner has"
          fc-list | wc -l
          fc-match sans-serif
          echo "--- same stages OUTSIDE the sandbox"
          /usr/bin/python3 -u -X faulthandler -c 'import gi;gi.require_version("Pango","1.0");gi.require_version("PangoCairo","1.0");from gi.repository import Pango,PangoCairo;l=Pango.Layout.new(PangoCairo.FontMap.get_default().create_context());d=Pango.FontDescription();d.set_family("sans-serif");l.set_font_description(d);l.set_text("hello",-1);print("outside:",l.get_iter().get_run().item.analysis.font.describe().get_family())'

      - name: Run integration tests in the sandbox
        run: uv run --python /usr/bin/python3 python -m harness.run_integration
