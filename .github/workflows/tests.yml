# CI: runs `uv run pytest` on every push and every pull request into main.
# Only runs tests — never merges, pushes or changes anything.
# GUI tests (-m gui) and real-desktop tests are NOT run here (no screen, no GTK 4.22, no Hyprland);
# those run locally / in the Hyprland VM.

name: tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]   # declared minimum (A20) + the dev machine's version

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked --python "$(which python)"

      - name: Run tests
        run: uv run --python "$(which python)" pytest -ra

  # M3.3: integration tests run ONLY inside bubblewrap. If the sandbox cannot start, this job FAILS
  # (harness exits 3) — it never falls back to running unsandboxed and never passes by skipping.
  integration:
    name: integration (bubblewrap sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: System packages (bubblewrap + the tools the integration tests drive)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap fontconfig pango1.0-tools gsettings-desktop-schemas \
            libglib2.0-bin python3-gi python3-gi-cairo gir1.2-pango-1.0 gir1.2-freedesktop python3-pytest lua5.4

      - name: Allow unprivileged user namespaces (Ubuntu 24.04 restricts them via AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked --python /usr/bin/python3

      - name: Diagnose the Pango probe (prints the stderr that run_cmd hides)
        continue-on-error: true
        run: |
          uv run --python /usr/bin/python3 python - <<'PY'
          import subprocess
          from pathlib import Path
          from harness import run_integration as ri, sandbox
          inner = r"""
          import os, subprocess, sys, traceback
          from pathlib import Path
          Path(os.environ["FONTCONFIG_FILE"]).write_text('<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd"><fontconfig><include>/etc/fonts/fonts.conf</include></fontconfig>')
          print("python", sys.version.split()[0], "FONTCONFIG_FILE", os.environ["FONTCONFIG_FILE"])
          sample = "The quick brown fox jumps over the lazy dog 0123456789"
          r = subprocess.run(["/usr/bin/python3", "-P", "-m", "scribesense.adapters.pango_probe", "sans-serif", sample], capture_output=True, text=True)
          print("probe exit code:", r.returncode, "(2 bad args, 3 no Pango, 4 layout failed)", r.stdout, r.stderr)
          try:
              from scribesense.adapters.pango_probe import drawn_families
              print("drawn_families ->", drawn_families("sans-serif", sample))
          except Exception:
              traceback.print_exc()
          print(subprocess.run(["fc-match", "-s", "sans-serif"], capture_output=True, text=True).stdout[:300])
          """
          cmd = ["/usr/bin/python3", "-c", inner]
          r = subprocess.run(sandbox.build_argv(cmd, repo=Path('.').resolve(), site_packages=ri.site_packages()), capture_output=True, text=True)
          print(r.returncode, r.stdout, r.stderr)
          PY

      - name: Run integration tests in the sandbox
        run: uv run --python /usr/bin/python3 python -m harness.run_integration
